name: Deploy

# Publica o site automaticamente sempre que a branch main recebe um push.
# Requer os secrets do repositório: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar a pasta www no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd ~/www
            git fetch origin main
            git reset --hard origin/main
