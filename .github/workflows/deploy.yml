name: Deploy

# Publica o site automaticamente sempre que a branch main recebe um push.
# Requer os secrets do repositório: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY.
# Veja instruções de configuração em README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar a pasta www no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ~/www
            git fetch origin main
            git reset --hard origin/main
